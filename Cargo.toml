[workspace]
resolver = "2"
members = ["crates/tts-engine", "crates/tts"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tts-engine = { path = "crates/tts-engine" }
# Same pin te ships (load-dynamic + api-21; dylib resolved at process start).
# Members that gate it declare it `optional = true` on their side.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-21"] }
# T006 flow-latent lane runtime: pure-Rust Phonon stack (xn tensors + flow LM
# + Mimi), no ggml, no FFI. `hf` gates the tokenizers-backed tokenizer reader;
# `xn` is a direct dep only so the lane can set the rayon pool size dial.
ptts = { version = "0.6.0", default-features = false, features = ["hf"] }
# T008 candle port (flow-candle feature).
candle-core = "0.11.1"
candle-nn = "0.11.1"
xn = { version = "0.2.13", default-features = false }
# ptts lane runs xn + ptts (which brings its own noise stack); the candle lane
# owns these sampler pins to match the oracle exactly (rng.rs).
rand = "0.9.0"
rand_distr = "0.5.0"
# Same pin the oracle ships for checkpoint tokenizers.json (features match
# ptts's manifest: fancy-regex only, defaults off).
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
# T011 piper G2P: in-process vendored espeak-ng (1.52.0.1) via espeak-rs 0.2
# (thewh1teagle/piper-rs); GPLv3 linking caveat documented in the lane.
espeak-rs = "0.2"
