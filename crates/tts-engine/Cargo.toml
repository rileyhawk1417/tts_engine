[package]
name = "tts-engine"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ort = { workspace = true, optional = true }
ptts = { workspace = true, optional = true }
xn = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
espeak-rs = { workspace = true, optional = true }

[features]
default = []
# T010 chatterbox (layer B): in-process FFI to llama.cpp's native Chatterbox
# TTS path via the workspace C++ shim (src/shim/chatterbox_shim.cpp) —
# static libllama + libmtmd + libggml from the pinned checkout
# (/teranux/third_party/llama.cpp @ 186eab1, release). No crate dep: the
# link closure is emitted in build.rs.
ggml-ffi = []
# Kokoro-82M ONNX graph lane (T004). `load-dynamic`: no bundled runtime — the
# 1.22.x dylib resolves at process start from TTS_ORT_DYLIB / ORT_DYLIB_PATH /
# the durable default (mirrors te's nemo lane); `api-21`: API level for that
# runtime. ORT allows one shared env per process.
graph-ort = ["dep:ort"]
# T006 Phonon flow-latent lane (gradium/phonon-31m-en, q8 gguf via ptts 0.6).
flow-ptts = ["dep:ptts", "dep:xn"]
# T008 candle Phonon port (from-scratch, oracle = ptts-0.6.0 / flow-ptts lane).
# rand pins match the oracle sampler exactly (rng.rs), tokenizers 0.23.1 is the
# oracle's tokenizer crate version.
flow-candle = ["dep:candle-core", "dep:candle-nn", "dep:rand", "dep:rand_distr", "dep:tokenizers", "dep:ptts"]
# T011 piper lane: fused VITS graphs via ort (same runtime class as graph-ort)
# + in-process espeak-ng G2P via espeak-rs. rand/rand_distr pins match the
# piper randn conventions (same crate versions as the ptts oracle sampler).
piper = ["dep:espeak-rs", "dep:ort", "dep:rand", "dep:rand_distr"]

# Chunk-2 GPU (2026-11-06): candle CUDA backend for the flow-candle lane
# (opt-in; off by default). Device picked at load via TTS_CANDLE_DEVICE
# (default cpu — byte-faithful with all banked rows; cuda|cuda:0 with the
# driver present). cudarc resolves driver libs at runtime; nvrtc JITs
# kernels on first inference (very first synth is cold — warm from run 2+).
flow-candle-cuda = ["flow-candle", "candle-core/cuda", "candle-nn/cuda"]

# Examples compile per-feature; the probes import lane deps, so gate them
# (auto-discovery would break `cargo test -p tts-engine` on any single-feature
# build).
[build-dependencies]
# T010 ggml-ffi: the C++ shim over llama.cpp is compiled by build.rs.
cc = { workspace = true }

[[example]]
name = "ptts_session_probe"
required-features = ["flow-ptts"]

[[example]]
name = "flow_ptts_lane_probe"
required-features = ["flow-ptts"]

[[example]]
name = "flow_candle_probe"
required-features = ["flow-candle"]

[[example]]
name = "piper_lane_probe"
required-features = ["piper"]

[[example]]
name = "flow_candle_parity_probe"
required-features = ["flow-candle"]

[[example]]
name = "neucodec_ort_bench"
required-features = ["graph-ort"]

[[example]]
name = "ggml_ffi_lane_probe"
required-features = ["ggml-ffi"]
